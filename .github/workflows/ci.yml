name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c constraints-rebuilt.txt -e ".[dev,research]"
      - run: python -m pytest -q
      - run: ruff check src tests
      - run: mypy src

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd frontend && npm ci && npm run build

  docker-integration:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: isolated-ci-only
      DATABASE_URL: postgresql://mobility_user:isolated-ci-only@db:5432/mobility
      FRONTEND_PORT: 13000
      BACKEND_PORT: 18000
      DATABASE_PORT: 15432
    steps:
      - uses: actions/checkout@v4
      - name: Build and run an isolated synthetic ingestion-to-web deployment
        run: docker compose -p mobility-ci -f docker-compose.yml -f docker-compose.smoke.yml up --build -d
      - name: Check both providers, JSON exports, API isolation and missing-file responses
        run: python scripts/check_deployment.py http://127.0.0.1:13000
      - name: Show container logs
        if: always()
        run: docker compose -p mobility-ci -f docker-compose.yml -f docker-compose.smoke.yml logs --tail=80
      - name: Remove only the isolated CI stack
        if: always()
        run: docker compose -p mobility-ci -f docker-compose.yml -f docker-compose.smoke.yml down -v
