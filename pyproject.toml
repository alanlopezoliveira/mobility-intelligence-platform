[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mobility-intelligence-platform"
version = "0.1.0"
description = "Mobility Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.2",
  "sqlalchemy>=2.0.31",
  "alembic>=1.13.2",
  "psycopg[binary]>=3.2.1",
  "geoalchemy2>=0.16.0",
  "pandas>=2.2.3",
  "numpy>=1.26.4",
  "pyyaml>=6.0.1",
  "requests>=2.32.0",
  "httpx>=0.27.0",
  "scikit-learn>=1.5.1",
  "lightgbm>=4.5.0",
  "pydantic-settings>=2.2.1",
  "python-dotenv>=1.0.1",
  "orjson>=3.0.0",
  "pydantic-extra-types>=2.4.0",
  "shapely>=2.0.0",
  "rarfile>=4.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.2",
  "pytest-asyncio>=0.23.7",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.5",
  "mypy>=1.10.0",
  "types-requests>=2.32.0",
]
research = [
  "xgboost>=2.1.1",
  "catboost>=1.2.5",
  "joblib>=1.4.0",
  "threadpoolctl>=3.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
