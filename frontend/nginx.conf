server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Batch exports are published to a shared volume after the UI image builds.
    # Missing JSON must return 404, never the SPA HTML fallback.
    location /project-data/ { alias /srv/exports/project-data/; }
    location /audit-data/ { alias /srv/exports/audit-data/; }
    location /analysis-data/ { alias /srv/exports/analysis-data/; }

    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
